name: Terraform Provider

on:
  push:
    paths:
      - "terraform/provider/**"
      - ".github/workflows/test-terraform-provider.yml"
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"
    paths:
      - "terraform/provider/**"
      - "litellm/proxy/**"
      - ".github/workflows/test-terraform-provider.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  provider-checks:
    name: Provider checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: terraform/provider/go.mod
          cache-dependency-path: terraform/provider/go.sum

      - name: Prepare Go module dependencies
        working-directory: terraform/provider
        run: go mod download

      - name: Check Go source formatting
        working-directory: terraform/provider
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::The following Go files need formatting:"
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - name: Run Go static analysis
        working-directory: terraform/provider
        run: go vet ./...

      - name: Build provider
        working-directory: terraform/provider
        run: go build -o "${RUNNER_TEMP}/terraform-provider-litellm" .

      - name: Run provider tests
        working-directory: terraform/provider
        timeout-minutes: 20
        run: go test ./...

  endpoint-drift:
    name: Endpoint drift audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up uv with retries
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Install locked CI and proxy dependencies
        run: bash .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra google --extra proxy --extra semantic-router

      - name: Generate Prisma client
        run: uv run --frozen prisma generate --schema litellm/proxy/schema.prisma

      - name: Generate proxy OpenAPI schema
        run: uv run --frozen python terraform/provider/tools/dump_openapi.py "${RUNNER_TEMP}/litellm-openapi.json"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: terraform/provider/go.mod
          cache-dependency-path: terraform/provider/go.sum

      - name: Audit provider endpoints against proxy schema
        working-directory: terraform/provider
        run: go run ./tools/endpointaudit -provider-dir ./litellm -spec "${RUNNER_TEMP}/litellm-openapi.json"
